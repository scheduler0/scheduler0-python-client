[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler0"
dynamic = ["version"]
description = "A Python client library for interacting with the Scheduler0 API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Scheduler0", email = "support@scheduler0.com"}
]
keywords = ["scheduler0", "scheduler", "cron", "job-scheduler", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/scheduler0/scheduler0-python-client"
Repository = "https://github.com/scheduler0/scheduler0-python-client"
Documentation = "https://api-reference.scheduler0.com"

# Single source of truth for the version: scheduler0/__init__.py __version__
[tool.setuptools.dynamic]
version = {attr = "scheduler0.__version__"}

# Only ship the library package; never ship the test suite as a top-level package.
[tool.setuptools.packages.find]
include = ["scheduler0*"]
exclude = ["tests*"]
